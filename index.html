<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Ballet AI Tracker</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    body {
      background: linear-gradient(135deg, #ffe4e1, #e6e6fa);
      font-family: 'Helvetica Neue', sans-serif;
      color: #6a5acd;
      text-align: center;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-family: 'Georgia', serif;
      font-style: italic;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    /* --- ONBOARDING SCREEN STYLES --- */
    #onboarding {
      background: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(106, 90, 205, 0.1);
      width: 400px;
      margin-top: 50px;
    }

    input, select {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 2px solid #e6e6fa;
      border-radius: 10px;
      color: #7b68ee;
      font-family: inherit;
    }

    button {
      background-color: #ff69b4;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.1em;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 20px;
      transition: 0.3s;
    }

    button:hover {
      background-color: #ff1493;
      transform: scale(1.05);
    }

    /* --- TRACKER APP STYLES --- */
    #tracker-app {
      display: none; /* Hidden until login */
      flex-direction: row;
      gap: 20px;
      margin-top: 20px;
      align-items: flex-start;
    }

    .tracker-container {
      position: relative;
      border: 8px solid #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(106, 90, 205, 0.2);
      overflow: hidden;
      background-color: #fff;
    }

    .input_video, .output_canvas {
      width: 640px;
      height: 480px;
      transform: scaleX(-1);
    }

    .output_canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    .feedback-panel {
      width: 320px;
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(106, 90, 205, 0.1);
      text-align: left;
    }

    .feedback-panel h2 {
      color: #ff69b4;
      font-size: 1.2em;
      margin-top: 0;
      border-bottom: 2px solid #ffe4e1;
      padding-bottom: 10px;
    }

    .status-badge {
      display: inline-block;
      background: #e6e6fa;
      color: #6a5acd;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 0.9em;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .feedback-text {
      font-size: 1.1em;
      font-weight: bold;
      color: #7b68ee;
      min-height: 60px;
    }

    .error-text {
      color: #ff4500; /* Red-orange for errors like "step back" */
    }

    .reference-image {
      width: 100%;
      border-radius: 10px;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Virtual Ballet Coach</h1>

  <div id="onboarding">
    <h2>Create Your Profile</h2>
    <input type="text" id="userName" placeholder="Your Name" required>
    
    <select id="danceStyle">
      <option value="" disabled selected>Select Your Method</option>
      <option value="vaganova">Vaganova (Russian)</option>
      <option value="cecchetti">Cecchetti (Italian)</option>
      <option value="rad">RAD (British)</option>
      <option value="balanchine">Balanchine (American)</option>
    </select>

    <select id="danceLevel">
      <option value="" disabled selected>Select Grade / Level</option>
      <option value="beginner">Beginner</option>
      <option value="intermediate">Intermediate / Pre-Pointe</option>
      <option value="advanced">Advanced / Pre-Pro</option>
    </select>

    <input type="text" id="userGoals" placeholder="E.g., Improve pirouettes, better turnout...">
    
    <button onclick="startApp()">Start Training ✨</button>
  </div>

  <div id="tracker-app">
    <div class="tracker-container">
      <video class="input_video" autoplay playsinline style="display:none;"></video>
      <canvas class="output_canvas" width="640" height="480"></canvas>
    </div>

    <div class="feedback-panel">
      <h2>Welcome, <span id="displayName">Dancer</span>!</h2>
      <div class="status-badge" id="detectedPosition">Detecting Position...</div>
      <div class="feedback-text" id="feedback">Stand back so your full body is in the camera view.</div>
      
      <img id="ref-image" class="reference-image" src="" alt="Ballet Reference">
    </div>
  </div>

  <script>
    // --- UI LOGIC ---
    function startApp() {
      const name = document.getElementById('userName').value || "Dancer";
      document.getElementById('displayName').innerText = name;
      
      // Hide onboarding, show tracker
      document.getElementById('onboarding').style.display = 'none';
      document.getElementById('tracker-app').style.display = 'flex';
      
      // Start the camera
      camera.start();
    }

    // --- AI LOGIC ---
    const videoElement = document.getElementsByClassName('input_video')[0];
    const canvasElement = document.getElementsByClassName('output_canvas')[0];
    const canvasCtx = canvasElement.getContext('2d');
    
    const feedbackText = document.getElementById('feedback');
    const detectedPositionBadge = document.getElementById('detectedPosition');
    const refImage = document.getElementById('ref-image');

    // Reference Images (You can swap these URLs with your own aesthetic photos later!)
    const images = {
      first: "https://images.unsplash.com/photo-1518834107812-67b0b7c58434?w=400&q=80",
      second: "https://images.unsplash.com/photo-1508700929628-666bc8bd84ea?w=400&q=80",
      fifth: "https://images.unsplash.com/photo-1547153760-18fc86324498?w=400&q=80"
    };

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        // Hide face dots (0-10)
        for (let i = 0; i <= 10; i++) results.poseLandmarks[i].visibility = 0;

        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#ffb6c1', lineWidth: 4});
        drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#9370db', lineWidth: 2, radius: 4});

        let leftWrist = results.poseLandmarks[15];
        let rightWrist = results.poseLandmarks[16];
        let leftShoulder = results.poseLandmarks[11];
        let rightShoulder = results.poseLandmarks[12];
        let leftAnkle = results.poseLandmarks[27];

        // 1. VISIBILITY CHECK: Is the full body in frame?
        if (leftAnkle.visibility < 0.5 || leftWrist.visibility < 0.5) {
          feedbackText.innerHTML = "<span class='error-text'>⚠️ Step back! Make sure your wrists and ankles are in the frame.</span>";
          detectedPositionBadge.innerText = "Camera Blocked";
          refImage.style.display = "none";
          return; // Stop running the rest of the checks until they step back
        }

        // 2. POSITION DETECTOR LOGIC
        // Math to find distance between wrists
        let wristDistance = Math.abs(leftWrist.x - rightWrist.x);
        
        // Are wrists above shoulders? (In HTML canvas, lower Y value means HIGHER up on screen)
        let wristsHigh = (leftWrist.y < leftShoulder.y) && (rightWrist.y < rightShoulder.y);
        let wristsLow = (leftWrist.y > leftShoulder.y) && (rightWrist.y > rightShoulder.y);

        if (wristsHigh && wristDistance < 0.3) {
          // Wrists are above head and close together
          detectedPositionBadge.innerText = "5th Position Detected";
          feedbackText.innerText = "Keep your shoulders pressed down. Don't let them rise to your ears!";
          refImage.src = images.fifth;
          refImage.style.display = "block";
        } 
        else if (wristsLow && wristDistance > 0.4) {
          // Wrists are low and far apart
          detectedPositionBadge.innerText = "2nd Position Detected";
          feedbackText.innerText = "Lengthen through your elbows. Support your arms from your back!";
          refImage.src = images.second;
          refImage.style.display = "block";
        } 
        else if (wristsLow && wristDistance < 0.2) {
          // Wrists are low and close together
          detectedPositionBadge.innerText = "1st Position Detected";
          feedbackText.innerText = "Imagine holding a beach ball. Relax your fingers—no tension in the hands!";
          refImage.src = images.first;
          refImage.style.display = "block";
        } 
        else {
          detectedPositionBadge.innerText = "Transitioning...";
          feedbackText.innerText = "Move into 1st, 2nd, or 5th position for feedback.";
          refImage.style.display = "none";
        }
      }
      canvasCtx.restore();
    }

    const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => { await pose.send({image: videoElement}); },
      width: 640, height: 480
    });
  </script>

</body>
</html>
