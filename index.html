<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Écarté.ai</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M25,75 C35,60 42,48 48,42 M48,42 C60,38 75,32 88,32 M48,42 C45,32 46,22 50,16 C53,16 54,26 48,42 M48,42 C52,52 58,65 64,80' fill='none' stroke='%231a1a1a' stroke-width='4' stroke-linecap='round'/><path d='M40,39 C32,34 20,30 12,30' fill='none' stroke='%231a1a1a' stroke-width='3' stroke-linecap='round'/></svg>">
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    /* --- LILAC AESTHETIC THEME --- */
    body {
      background-color: #E6E6FA; 
      background-image: radial-gradient(circle at center, #F8F8FF 0%, #E6E6FA 100%);
      font-family: 'Helvetica Neue', sans-serif;
      color: #4a4a4a;
      text-align: center;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0.02;
      background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><path d="M50 10 Q60 40 80 50 Q60 60 50 90 Q40 60 20 50 Q40 40 50 10 Z" fill="none" stroke="black" stroke-width="2"/></svg>');
      pointer-events: none;
      z-index: -1;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 160px;
      border-radius: 12px;
      mix-blend-mode: multiply; 
    }

    /* --- PAGE CONTAINERS --- */
    .page {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0, 0.05);
      width: 450px;
      text-align: left;
    }

    #setup-page { display: flex; flex-direction: column; }
    #profile-page { display: none; }
    #tracker-page { display: none; width: auto; background: transparent; box-shadow: none; align-items: flex-start; gap: 20px; }
    #summary-page { display: none; flex-direction: column; }

    /* --- INPUTS & BUTTONS --- */
    label {
      font-weight: bold;
      color: #666;
      font-size: 0.9em;
      margin-top: 12px;
      display: block;
    }

    input[type="text"], select {
      width: 90%;
      padding: 11px;
      margin: 6px 0 16px 0;
      border: 1px solid #dcdcdc;
      border-radius: 10px;
      font-family: inherit;
      background-color: #fafafa;
    }

    .btn-group {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    button {
      background-color: #1a1a1a; 
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.1em;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button.secondary {
      background-color: #E6E6FA;
      color: #333;
      border: 1px solid #ccc;
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

    /* --- TRACKER APP --- */
    .tracker-container {
      position: relative;
      border: 8px solid #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0, 0.1);
      overflow: hidden;
      background-color: #000;
      width: 640px;
      height: 480px;
    }

    .input_video, .output_canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1); 
    }

    .output_canvas {
      position: absolute;
      top: 0; left: 0;
    }

    .feedback-panel {
      width: 320px;
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0, 0.1);
      text-align: left;
    }

    .status-badge {
      display: inline-block;
      background: #E6E6FA;
      color: #333;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 0.9em;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .feedback-text {
      font-size: 1em;
      line-height: 1.4;
      color: #555;
      min-height: 60px;
    }
    
    .arm-feedback {
      margin-top: 10px;
      padding: 10px;
      background: #fafafa;
      border-left: 3px solid #ff4d4d; 
      font-size: 0.9em;
    }

    /* --- SUMMARY UI STYLING --- */
    .summary-block {
      margin-bottom: 15px;
      padding: 12px;
      background: #fafafa;
      border-radius: 10px;
      border-left: 4px solid #1a1a1a;
    }

    .summary-block h3 {
      margin: 0 0 5px 0;
      font-size: 1.05em;
      color: #222;
    }

    .summary-block ul {
      margin: 0;
      padding-left: 20px;
      color: #555;
      font-size: 0.95em;
    }

    .error-text { color: #d9534f; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <img src="Red and Black Ballet Logo.jpg" alt="Écarté.ai Logo" class="logo">
  </div>

  <div id="setup-page" class="page">
    <h2>Welcome to the Studio</h2>
    
    <label>Name</label>
    <input type="text" id="userName" placeholder="Your Name">

    <label>Method / School</label>
    <select id="danceMethod">
      <option value="Vaganova">Vaganova</option>
      <option value="Cecchetti">Cecchetti</option>
      <option value="Royal Academy of Dance (RAD)">Royal Academy of Dance (RAD)</option>
      <option value="Balanchine">Balanchine</option>
      <option value="French School">French School</option>
      <option value="Bournonville">Bournonville</option>
    </select>

    <label>Camera Focus Area</label>
    <select id="cameraFocus">
      <option value="upper" selected>Upper Body (Arms, Back, Head)</option>
      <option value="lower">Lower Body (Legs, Feet)</option>
      <option value="full">Full Body</option>
    </select>

    <label>Your Focus / Goals</label>
    <input type="text" id="userGoals" placeholder="E.g. Extended lines, softer fingers...">
    
    <div class="btn-group" style="justify-content: flex-end;">
      <button onclick="goToProfile()">Next ➔</button>
    </div>
  </div>

  <div id="profile-page" class="page">
    <h2>Dancer Dashboard</h2>
    <p><strong>Name:</strong> <span id="display-name"></span></p>
    <p><strong>Method:</strong> <span id="display-method"></span></p>
    <p><strong>Tracking Focus:</strong> <span id="display-focus"></span></p>
    <p><strong>Goals:</strong> <span id="display-goals"></span></p>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    
    <div class="btn-group">
      <button class="secondary" onclick="goToSetup()">Back</button>
      <button onclick="goToTracker()">Next ➔ Enter Studio</button>
    </div>
  </div>

  <div id="tracker-page" class="page">
    <div class="tracker-container">
      <video class="input_video" autoplay playsinline style="display:none;"></video>
      <canvas class="output_canvas" width="640" height="480"></canvas>
    </div>

    <div class="feedback-panel">
      <h2>Live Feedback</h2>
      <div class="status-badge" id="detectedPosition">Detecting...</div>
      <div class="feedback-text" id="feedback">Loading your mirror...</div>
      <div class="arm-feedback" id="armFeedback">Tracking arms...</div>
      
      <div class="btn-group" style="margin-top: 30px;">
        <button class="secondary" onclick="goToEndSession()">End Session ➔</button>
      </div>
    </div>
  </div>

  <div id="summary-page" class="page">
    <h2>Session Summary</h2>
    <p>Here is your structured performance breakdown by position:</p>
    
    <div id="summaryContainer" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;">
      </div>

    <div class="btn-group" style="justify-content: flex-end;">
      <button onclick="goToProfile()">Start New Session ➔</button>
    </div>
  </div>

  <script>
    // --- NAVIGATION & INTELLIGENT STORAGE ---
    let currentFocus = "upper";
    let positionHistory = {}; 

    function hideAllPages() {
      document.getElementById('setup-page').style.display = 'none';
      document.getElementById('profile-page').style.display = 'none';
      document.getElementById('tracker-page').style.display = 'none';
      document.getElementById('summary-page').style.display = 'none';
    }

    function goToSetup() {
      hideAllPages();
      document.getElementById('setup-page').style.display = 'flex';
    }

    function goToProfile() {
      hideAllPages();
      currentFocus = document.getElementById('cameraFocus').value;
      
      document.getElementById('display-name').innerText = document.getElementById('userName').value || "Dancer";
      document.getElementById('display-method').innerText = document.getElementById('danceMethod').value;
      document.getElementById('display-focus').innerText = currentFocus === "upper" ? "Upper Body" : currentFocus === "lower" ? "Lower Body" : "Full Body";
      document.getElementById('display-goals').innerText = document.getElementById('userGoals').value || "None set";
      
      document.getElementById('profile-page').style.display = 'flex';
      document.getElementById('profile-page').style.flexDirection = 'column';
    }

    let cameraStarted = false;
    function goToTracker() {
      hideAllPages();
      document.getElementById('tracker-page').style.display = 'flex';
      positionHistory = {}; // Clean session logs for a new run
      if (!cameraStarted) {
        camera.start();
        cameraStarted = true;
      }
    }

    function goToEndSession() {
      hideAllPages();
      const container = document.getElementById('summaryContainer');
      container.innerHTML = "";

      const trackedPositions = Object.keys(positionHistory);

      if (trackedPositions.length === 0) {
        container.innerHTML = "<div class='summary-block'><h3>No Positions Tracked</h3><ul><li>Try staying inside the camera frame longer next session!</li></ul></div>";
      } else {
        trackedPositions.forEach(pos => {
          let blockHTML = `<div class='summary-block'><h3>${pos}</h3><ul>`;
          let errors = Array.from(positionHistory[pos]); // Convert Set to Array to avoid repeats
          
          if (errors.length === 0) {
            blockHTML += `<li>✨ Perfect alignment kept throughout! Great form.</li>`;
          } else {
            errors.forEach(err => {
              blockHTML += `<li>${err}</li>`;
            });
          }
          blockHTML += `</ul></div>`;
          container.innerHTML += blockHTML;
        });
      }
      document.getElementById('summary-page').style.display = 'flex';
    }

    // --- AI MATH & ALIGNMENT LOGIC ---
    const videoElement = document.getElementsByClassName('input_video')[0];
    const canvasElement = document.getElementsByClassName('output_canvas')[0];
    const canvasCtx = canvasElement.getContext('2d');
    
    const feedbackText = document.getElementById('feedback');
    const armFeedbackText = document.getElementById('armFeedback');
    const detectedPositionBadge = document.getElementById('detectedPosition');

    function calculateAngle(a, b, c) {
      let radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs(radians * 180.0 / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return angle;
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        for (let i = 0; i <= 10; i++) results.poseLandmarks[i].visibility = 0;

        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#1a1a1a', lineWidth: 3});
        drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#ff4d4d', lineWidth: 2, radius: 4});

        let leftWrist = results.poseLandmarks[15];
        let rightWrist = results.poseLandmarks[16];
        let leftElbow = results.poseLandmarks[13];
        let rightElbow = results.poseLandmarks[14];
        let leftShoulder = results.poseLandmarks[11];
        let rightShoulder = results.poseLandmarks[12];

        // RAW GEOMETRIC CHECKS
        let leftAngle = calculateAngle(leftShoulder, leftElbow, leftWrist);
        let rightAngle = calculateAngle(rightShoulder, rightElbow, rightWrist);
        let currentFrameErrors = [];

        // Height Mismatch
        if (Math.abs(leftWrist.y - rightWrist.y) > 0.08) {
          currentFrameErrors.push("One arm is higher up than the other. Level your frame.");
        }
        
        // Curvature Deficiencies (except in Arabesque where elbows are straighter)
        let isLeftExtended = leftAngle > 140;
        let isRightExtended = rightAngle > 140;

        if (!isLeftExtended && leftAngle < 125) currentFrameErrors.push("Left elbow is dropped or over-bent.");
        if (!isRightExtended && rightAngle < 125) currentFrameErrors.push("Right elbow is dropped or over-bent.");

        // CORE MATH GRID
        let wristDistance = Math.abs(leftWrist.x - rightWrist.x);
        let avgShoulderY = (leftShoulder.y + rightShoulder.y) / 2;
        let currentPosName = "Transitioning...";

        let leftHigh = leftWrist.y < avgShoulderY - 0.12;
        let rightHigh = rightWrist.y < avgShoulderY - 0.12;
        let leftMid = leftWrist.y >= avgShoulderY - 0.12 && leftWrist.y <= avgShoulderY + 0.12;
        let rightMid = rightWrist.y >= avgShoulderY - 0.12 && rightWrist.y <= avgShoulderY + 0.12;
        let leftLow = leftWrist.y > avgShoulderY + 0.12;
        let rightLow = rightWrist.y > avgShoulderY + 0.12;

        let leftNarrow = Math.abs(leftWrist.x - leftShoulder.x) < 0.15;
        let rightNarrow = Math.abs(rightWrist.x - rightShoulder.x) < 0.15;

        // ARABESQUE LINE DETECTION
        let bothSameSide = (leftWrist.x < rightShoulder.x && rightWrist.x < rightShoulder.x) || (leftWrist.x > leftShoulder.x && rightWrist.x > leftShoulder.x);

        if (isLeftExtended && isRightExtended) {
          if (bothSameSide) {
            if (Math.abs(leftWrist.y - rightWrist.y) < 0.15) {
              currentPosName = "3rd Arabesque Line";
              feedbackText.innerText = "Both arms extended forward. Ensure your shoulders stay pressed down.";
            } else {
              currentPosName = "4th Arabesque Line";
              feedbackText.innerText = "Deep cross line. Keep energy projecting out through your back.";
            }
          } else if (wristDistance > 0.5 && (leftMid || leftHigh) && (rightMid || rightHigh)) {
            if (Math.abs(leftWrist.y - rightWrist.y) > 0.1) {
              currentPosName = "1st Arabesque Line";
              feedbackText.innerText = "Highest arm forward, opposite arm extending side/back. Lift your chest.";
            } else {
              currentPosName = "2nd Arabesque Line";
              feedbackText.innerText = "Squared shoulders, opposite arm forward. Keep the line long.";
            }
          }
        }

        // STANDARD POSITIONS
        if (currentPosName === "Transitioning..." || !currentPosName.includes("Arabesque")) {
          // If arms aren't intentionally extended, check for locked elbows
          if (leftAngle > 162 && !currentPosName.includes("Arabesque")) currentFrameErrors.push("Left elbow is locked too straight.");
          if (rightAngle > 162 && !currentPosName.includes("Arabesque")) currentFrameErrors.push("Right elbow is locked too straight.");

          if (leftHigh && rightHigh) {
            currentPosName = (wristDistance < 0.22) ? "5th Position" : "Open 5th Position";
          } 
          else if (leftMid && rightMid) {
            if (wristDistance > 0.48) currentPosName = "2nd Position";
            else if (wristDistance < 0.24) currentPosName = "1st Position";
            else currentPosName = "Demi-Seconde";
          } 
          else if (leftLow && rightLow && wristDistance < 0.26) {
            currentPosName = "Bras Bas";
          }
          else if ((leftHigh && rightMid) || (rightHigh && leftMid)) {
            // Distinguish 3rd vs 4th based on how narrow the mid-level arm is
            let midArmNarrow = (leftMid && leftNarrow) || (rightMid && rightNarrow);
            currentPosName = midArmNarrow ? "4th Position" : "3rd Position";
          }
          else if ((leftMid && rightLow) || (rightMid && leftLow)) {
            currentPosName = "Open 4th Position";
          }

          // Update standard position text
          if (currentPosName === "5th Position") feedbackText.innerText = "Frame your face nicely. Drop shoulder blades down your back.";
          else if (currentPosName === "Open 5th Position") feedbackText.innerText = "Keep the breathing space up high. Ensure hands do not drop back.";
          else if (currentPosName === "2nd Position") feedbackText.innerText = "Support from the upper back. Slope the line down subtly.";
          else if (currentPosName === "1st Position") feedbackText.innerText = "Maintain an active oval circle opposite your sternum.";
          else if (currentPosName === "Bras Bas") feedbackText.innerText = "Preparatory resting curve. Keep hands clear of your thighs.";
          else if (currentPosName === "3rd Position") feedbackText.innerText = "One arm high, one arm out to the side. Connect your center.";
          else if (currentPosName === "4th Position") feedbackText.innerText = "One arm high, one arm curved in front. Keep the box of your hips square.";
        }

        detectedPositionBadge.innerText = currentPosName;

        // SUMMARY LOGGING
        if (currentPosName !== "Transitioning...") {
          if (!positionHistory[currentPosName]) {
            positionHistory[currentPosName] = new Set();
          }
          currentFrameErrors.forEach(err => positionHistory[currentPosName].add(err));
        }

        // LIVE UI TEXT
        if (currentFrameErrors.length === 0) {
          armFeedbackText.innerText = "✨ Balanced expansion. Soften your hands and extend naturally.";
        } else {
          armFeedbackText.innerText = currentFrameErrors.join(" ");
        }
      }
      canvasCtx.restore();
    }

    const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => { await pose.send({image: videoElement}); },
      width: 640, height: 480
    });
  </script>

</body>
</html>
