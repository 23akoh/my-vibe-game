<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Écarté.ai</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    /* --- LILAC AESTHETIC THEME --- */
    body {
      background-color: #E6E6FA; 
      background-image: radial-gradient(circle at center, #F8F8FF 0%, #E6E6FA 100%);
      font-family: 'Helvetica Neue', sans-serif;
      color: #4a4a4a;
      text-align: center;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0.02;
      background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><path d="M50 10 Q60 40 80 50 Q60 60 50 90 Q40 60 20 50 Q40 40 50 10 Z" fill="none" stroke="black" stroke-width="2"/></svg>');
      pointer-events: none;
      z-index: -1;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
    }

    /* Minimalist Ballerina Line Drawing */
    .ballerina-icon {
      width: 100px;
      height: 100px;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Cosmopolitan', 'Great Vibes', cursive; 
      font-size: 3.5em;
      font-weight: normal;
      color: #333;
      margin: 0;
    }

    /* --- PAGE CONTAINERS --- */
    .page {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0, 0.05);
      width: 450px;
      text-align: left;
    }

    #setup-page { display: flex; flex-direction: column; }
    #profile-page { display: none; }
    #tracker-page { display: none; width: auto; background: transparent; box-shadow: none; align-items: flex-start; gap: 20px; }
    #summary-page { display: none; flex-direction: column; }

    /* --- INPUTS & BUTTONS --- */
    label {
      font-weight: bold;
      color: #666;
      font-size: 0.9em;
      margin-top: 12px;
      display: block;
    }

    input[type="text"], select {
      width: 90%;
      padding: 11px;
      margin: 6px 0 16px 0;
      border: 1px solid #dcdcdc;
      border-radius: 10px;
      font-family: inherit;
      background-color: #fafafa;
    }

    .btn-group {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    button {
      background-color: #1a1a1a; 
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.1em;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button.secondary {
      background-color: #E6E6FA;
      color: #333;
      border: 1px solid #ccc;
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

    /* --- TRACKER APP --- */
    .tracker-container {
      position: relative;
      border: 8px solid #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0, 0.1);
      overflow: hidden;
      background-color: #000;
      width: 640px;
      height: 480px;
    }

    .input_video, .output_canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1); 
    }

    .output_canvas {
      position: absolute;
      top: 0; left: 0;
    }

    .feedback-panel {
      width: 320px;
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0, 0.1);
      text-align: left;
    }

    .status-badge {
      display: inline-block;
      background: #E6E6FA;
      color: #333;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 0.9em;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .feedback-text {
      font-size: 1em;
      line-height: 1.4;
      color: #555;
      min-height: 60px;
    }
    
    .arm-feedback {
      margin-top: 10px;
      padding: 10px;
      background: #fafafa;
      border-left: 3px solid #ff4d4d; 
      font-size: 0.9em;
    }

    .summary-list {
      padding-left: 20px;
      line-height: 1.6;
    }

    .summary-list li {
      margin-bottom: 10px;
      color: #555;
    }

    .error-text { color: #d9534f; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <svg class="ballerina-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 20 C53 20 55 23 53 26 C51 28 49 28 48 32 C47 36 53 45 56 55 C58 62 61 75 62 85 C60 85 58 80 56 72 C54 65 51 58 49 58 C47 58 44 65 42 72 C40 80 38 85 36 85 C37 75 40 62 42 55 C45 45 51 36 50 32 C49 28 47 28 45 26 C43 23 45 20 47 20 Z" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M48 35 C40 32 30 25 25 25 C27 28 35 35 44 39" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M52 35 C60 32 70 25 75 25 C73 28 65 35 56 39" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M35 58 C40 55 50 53 55 53 C60 53 62 56 65 58" fill="none" stroke="#ff4d4d" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <h1>Écarté.ai</h1>
  </div>

  <div id="setup-page" class="page">
    <h2>Welcome to the Studio</h2>
    
    <label>Name</label>
    <input type="text" id="userName" placeholder="Your Name">

    <label>Method / School</label>
    <select id="danceMethod">
      <option value="Vaganova">Vaganova</option>
      <option value="Cecchetti">Cecchetti</option>
      <option value="Royal Academy of Dance (RAD)">Royal Academy of Dance (RAD)</option>
      <option value="Balanchine">Balanchine</option>
      <option value="French School">French School</option>
      <option value="Bournonville">Bournonville</option>
    </select>

    <label>Camera Focus Area</label>
    <select id="cameraFocus">
      <option value="upper" selected>Upper Body (Arms, Back, Head)</option>
      <option value="lower">Lower Body (Legs, Feet)</option>
      <option value="full">Full Body</option>
    </select>

    <label>Your Focus / Goals</label>
    <input type="text" id="userGoals" placeholder="E.g. Extended lines, softer fingers...">
    
    <div class="btn-group" style="justify-content: flex-end;">
      <button onclick="goToProfile()">Next ➔</button>
    </div>
  </div>

  <div id="profile-page" class="page">
    <h2>Dancer Dashboard</h2>
    <p><strong>Name:</strong> <span id="display-name"></span></p>
    <p><strong>Method:</strong> <span id="display-method"></span></p>
    <p><strong>Tracking Focus:</strong> <span id="display-focus"></span></p>
    <p><strong>Goals:</strong> <span id="display-goals"></span></p>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    
    <div class="btn-group">
      <button class="secondary" onclick="goToSetup()">Back</button>
      <button onclick="goToTracker()">Enter Studio</button>
    </div>
  </div>

  <div id="tracker-page" class="page">
    <div class="tracker-container">
      <video class="input_video" autoplay playsinline style="display:none;"></video>
      <canvas class="output_canvas" width="640" height="480"></canvas>
    </div>

    <div class="feedback-panel">
      <h2>Live Feedback</h2>
      <div class="status-badge" id="detectedPosition">Detecting...</div>
      <div class="feedback-text" id="feedback">Loading your mirror...</div>
      <div class="arm-feedback" id="armFeedback">Tracking arms...</div>
      
      <div class="btn-group" style="margin-top: 30px;">
        <button class="secondary" onclick="goToEndSession()">End Session</button>
      </div>
    </div>
  </div>

  <div id="summary-page" class="page">
    <h2>Session Summary</h2>
    <p>Great work in the studio! Here is the technique feedback collected during your session:</p>
    <ul id="summaryFeedbackList" class="summary-list">
      </ul>
    <div class="btn-group" style="justify-content: flex-end;">
      <button onclick="goToProfile()">Return to Dashboard</button>
    </div>
  </div>

  <script>
    // --- NAVIGATION & SUMMARY STORAGE ---
    let currentFocus = "upper";
    let gatheredFeedback = new Set(); // Stores unique corrections during the session

    function hideAllPages() {
      document.getElementById('setup-page').style.display = 'none';
      document.getElementById('profile-page').style.display = 'none';
      document.getElementById('tracker-page').style.display = 'none';
      document.getElementById('summary-page').style.display = 'none';
    }

    function goToSetup() {
      hideAllPages();
      document.getElementById('setup-page').style.display = 'flex';
    }

    function goToProfile() {
      hideAllPages();
      currentFocus = document.getElementById('cameraFocus').value;
      
      document.getElementById('display-name').innerText = document.getElementById('userName').value || "Dancer";
      document.getElementById('display-method').innerText = document.getElementById('danceMethod').value;
      document.getElementById('display-focus').innerText = currentFocus === "upper" ? "Upper Body" : currentFocus === "lower" ? "Lower Body" : "Full Body";
      document.getElementById('display-goals').innerText = document.getElementById('userGoals').value || "None set";
      
      document.getElementById('profile-page').style.display = 'flex';
      document.getElementById('profile-page').style.flexDirection = 'column';
    }

    let cameraStarted = false;
    function goToTracker() {
      hideAllPages();
      document.getElementById('tracker-page').style.display = 'flex';
      gatheredFeedback.clear(); // Reset past notes for a fresh run
      if (!cameraStarted) {
        camera.start();
        cameraStarted = true;
      }
    }

    function goToEndSession() {
      hideAllPages();
      const summaryList = document.getElementById('summaryFeedbackList');
      summaryList.innerHTML = "";

      if (gatheredFeedback.size === 0) {
        summaryList.innerHTML = "<li>✨ Perfect execution! No critical alignment errors were triggered during this practice run.</li>";
      } else {
        gatheredFeedback.forEach(item => {
          summaryList.innerHTML += `<li>${item}</li>`;
        });
      }
      document.getElementById('summary-page').style.display = 'flex';
    }

    // --- AI MATH & SHAPE RECOGNITION ---
    const videoElement = document.getElementsByClassName('input_video')[0];
    const canvasElement = document.getElementsByClassName('output_canvas')[0];
    const canvasCtx = canvasElement.getContext('2d');
    
    const feedbackText = document.getElementById('feedback');
    const armFeedbackText = document.getElementById('armFeedback');
    const detectedPositionBadge = document.getElementById('detectedPosition');

    function calculateAngle(a, b, c) {
      let radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs(radians * 180.0 / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return angle;
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        for (let i = 0; i <= 10; i++) results.poseLandmarks[i].visibility = 0;

        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#1a1a1a', lineWidth: 3});
        drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#ff4d4d', lineWidth: 2, radius: 4});

        let leftWrist = results.poseLandmarks[15];
        let rightWrist = results.poseLandmarks[16];
        let leftElbow = results.poseLandmarks[13];
        let rightElbow = results.poseLandmarks[14];
        let leftShoulder = results.poseLandmarks[11];
        let rightShoulder = results.poseLandmarks[12];
        let leftAnkle = results.poseLandmarks[27];
        let rightAnkle = results.poseLandmarks[28];

        // 1. FRAME VISIBILITY VALIDATION
        let visibilityIssue = false;
        if (currentFocus === "upper" && (leftWrist.visibility < 0.5 || rightWrist.visibility < 0.5)) visibilityIssue = true;
        if (currentFocus === "lower" && (leftAnkle.visibility < 0.5 || rightAnkle.visibility < 0.5)) visibilityIssue = true;
        if (currentFocus === "full" && (leftWrist.visibility < 0.5 || leftAnkle.visibility < 0.5)) visibilityIssue = true;

        if (visibilityIssue) {
          feedbackText.innerHTML = `<span class='error-text'>⚠️ Target frame blocked! Readjust so your ${currentFocus} body is visible in the mirror feed.</span>`;
          armFeedbackText.innerText = "";
          canvasCtx.restore();
          return;
        }

        // 2. ARM CURVATURE & HEIGHT BALANCING ANALYSIS
        let leftAngle = calculateAngle(leftShoulder, leftElbow, leftWrist);
        let rightAngle = calculateAngle(rightShoulder, rightElbow, rightWrist);
        let armStatus = [];

        // Height mismatch check
        if (Math.abs(leftWrist.y - rightWrist.y) > 0.07) {
          let errorMsg = "One arm is riding higher up than the other. Level your shoulders and wrists!";
          armStatus.push(errorMsg);
          gatheredFeedback.add(errorMsg);
        }

        if (leftAngle > 162) {
          armStatus.push("Left elbow is locked straight.");
          gatheredFeedback.add("Soften your left elbow to keep a classical, fluid curve.");
        } else if (leftAngle < 125) {
          armStatus.push("Left elbow is too sharply bent.");
          gatheredFeedback.add("Avoid dropping or over-bending the left elbow.");
        }
        
        if (rightAngle > 162) {
          armStatus.push("Right elbow is locked straight.");
          gatheredFeedback.add("Soften your right elbow to keep a classical, fluid curve.");
        } else if (rightAngle < 125) {
          armStatus.push("Right elbow is too sharply bent.");
          gatheredFeedback.add("Avoid dropping or over-bending the right elbow.");
        }

        if (armStatus.length === 0) {
          armFeedbackText.innerText = "✨ Balanced expansion. Soften your hands and elongate out through your fingers.";
        } else {
          armFeedbackText.innerText = armStatus.join(" ") + " Keep fingers soft and expressive.";
        }

        // 3. ENHANCED POSITION IDENTIFIER
        let wristDistance = Math.abs(leftWrist.x - rightWrist.x);
        let avgShoulderY = (leftShoulder.y + rightShoulder.y) / 2;
        
        let leftHigh = leftWrist.y < avgShoulderY - 0.15;
        let rightHigh = rightWrist.y < avgShoulderY - 0.15;
        let leftMid = leftWrist.y >= avgShoulderY - 0.15 && leftWrist.y <= avgShoulderY + 0.12;
        let rightMid = rightWrist.y >= avgShoulderY - 0.15 && rightWrist.y <= avgShoulderY + 0.12;
        let leftLow = leftWrist.y > avgShoulderY + 0.12;
        let rightLow = rightWrist.y > avgShoulderY + 0.12;

        // Symmetric Stances
        if (leftHigh && rightHigh) {
          if (wristDistance < 0.22) {
            detectedPositionBadge.innerText = "5th Position";
            feedbackText.innerText = "Frame your face nicely. Pull your shoulders down away from your ears.";
          } else {
            detectedPositionBadge.innerText = "Open 5th Position";
            feedbackText.innerText = "Keep the breathing space up high. Ensure hands do not drop back past your peripheral vision.";
          }
        } 
        else if (leftMid && rightMid) {
          if (wristDistance > 0.48) {
            detectedPositionBadge.innerText = "2nd Position";
            feedbackText.innerText = "Support from the upper back. Slope the line down subtly from shoulder to fingertip.";
          } else if (wristDistance < 0.25) {
            detectedPositionBadge.innerText = "1st Position";
            feedbackText.innerText = "Create an active circle opposite your sternum. Do not let hands overlap.";
          } else {
            detectedPositionBadge.innerText = "Demi-Seconde";
            feedbackText.innerText = "Halfway setting. Maintain long, low lines floating off the hips.";
          }
        } 
        else if (leftLow && rightLow) {
          detectedPositionBadge.innerText = "Bras Bas";
          feedbackText.innerText = "Preparatory resting curve. Keep your hands well forward of your thighs, keeping the oval round.";
        }
        // Asymmetric/Hybrid Configurations (3rd and 4th Variations)
        else if ((leftHigh && rightMid) || (rightHigh && leftMid)) {
          detectedPositionBadge.innerText = "3rd Position";
          feedbackText.innerText = "Coordinate carefully. One arm frames the upper crown while the other supports the side.";
        }
        else if ((leftHigh && rightLow) || (rightHigh && leftLow)) {
          detectedPositionBadge.innerText = "Open 4th Position";
          feedbackText.innerText = "Keep the high arm lifted and forward while the lower arm stays dropped in a safe curve.";
        }
        else if ((leftMid && rightLow) || (rightMid && leftLow)) {
          detectedPositionBadge.innerText = "4th Position (En Avant)";
          feedbackText.innerText = "Keep your forward arm steady in front of your ribcage while the lower arm holds its frame.";
        }
        else {
          detectedPositionBadge.innerText = "Transitioning...";
          feedbackText.innerText = "Holding transitional carriage. Steady your core alignment.";
        }
      }
      canvasCtx.restore();
    }

    const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => { await pose.send({image: videoElement}); },
      width: 640, height: 480
    });
  </script>

</body>
</html>
