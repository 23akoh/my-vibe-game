<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Ballet AI Tracker</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    /* Aesthetic Pink & Purple Pastel Theme */
    body {
      background: linear-gradient(135deg, #ffe4e1, #e6e6fa); /* MistyRose to Lavender */
      font-family: 'Helvetica Neue', sans-serif;
      color: #6a5acd; /* SlateBlue */
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-family: 'Georgia', serif;
      font-style: italic;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    p {
      color: #7b68ee;
      font-size: 1.1em;
      margin-bottom: 30px;
    }

    /* Container to overlap video and canvas */
    .tracker-container {
      position: relative;
      display: inline-block;
      border: 8px solid #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(106, 90, 205, 0.2);
      overflow: hidden;
      background-color: #fff;
    }

    /* Mirror the video so it acts like a studio mirror */
    .input_video {
      display: block;
      transform: scaleX(-1);
      width: 640px;
      height: 480px;
      object-fit: cover;
    }

    /* Put the canvas exactly over the video */
    .output_canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform: scaleX(-1);
      width: 640px;
      height: 480px;
    }

    /* Loading message */
    #loading {
      font-weight: bold;
      color: #ff69b4; /* HotPink */
    }
  </style>
</head>
<body>

  <h1>Virtual Ballet Coach</h1>
  <p>Stand back and let the AI map your alignment.</p>
  <div id="loading">Loading camera and AI model... Please allow camera access.</div>

  <div class="tracker-container">
    <video class="input_video" autoplay playsinline></video>
    <canvas class="output_canvas" width="640" height="480"></canvas>
  </div>

  <script>
    const videoElement = document.getElementsByClassName('input_video')[0];
    const canvasElement = document.getElementsByClassName('output_canvas')[0];
    const canvasCtx = canvasElement.getContext('2d');
    const loadingText = document.getElementById('loading');

    // This function runs every time the AI detects a pose
    function onResults(results) {
      // Hide the loading text once the camera is running
      loadingText.style.display = 'none';

      // Clear the canvas for the new frame
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // Draw the connections (bones) and landmarks (joints)
      if (results.poseLandmarks) {
        // Draw the lines connecting the joints in a pretty pastel pink
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS,
                       {color: '#ffb6c1', lineWidth: 4}); // LightPink
        
        // Draw the dots for the joints in purple
        drawLandmarks(canvasCtx, results.poseLandmarks,
                      {color: '#9370db', lineWidth: 2, radius: 4}); // MediumPurple
      }
      canvasCtx.restore();
    }

    // Set up the MediaPipe Pose AI
    const pose = new Pose({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
    }});
    
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    
    pose.onResults(onResults);

    // Set up the webcam
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({image: videoElement});
      },
      width: 640,
      height: 480
    });
    
    camera.start();
  </script>

</body>
</html>
