<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Runner Balancer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div id="ui-overlay">
            <div class="score-board">Score: <span id="scoreVal">0</span></div>
            <div class="score-board">High Score: <span id="highScoreVal">0</span></div>
        </div>

        <div id="game-over-screen" class="hidden">
            <h1>GAME OVER</h1>
            <p>Your ball fell or you hit an obstacle!</p>
            <button id="restartBtn">Run Again (SPACE)</button>
        </div>
    </div>

    <div id="controls-guide">
        <p><span class="key">SPACEBAR</span> to Jump over obstacles</p>
        <p><span class="key">LEFT / RIGHT ARROWS</span> (or <span class="key">A / D</span>) to Tilt & Balance the Ball</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
