<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Écarté.ai - Ballet Training</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    /* --- LILAC AESTHETIC THEME --- */
    body {
      background-color: #E6E6FA; /* Lilac */
      background-image: radial-gradient(circle at center, #F8F8FF 0%, #E6E6FA 100%);
      font-family: 'Helvetica Neue', sans-serif;
      color: #4a4a4a;
      text-align: center;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Subtle ballet line art detail in the background */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0.03;
      background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><path d="M50 10 Q60 40 80 50 Q60 60 50 90 Q40 60 20 50 Q40 40 50 10 Z" fill="none" stroke="black" stroke-width="2"/></svg>');
      pointer-events: none;
      z-index: -1;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      width: 150px;
      border-radius: 10px;
      mix-blend-mode: multiply; /* Helps the white background of the logo blend in */
    }

    h1 {
      font-family: 'Georgia', serif;
      font-style: italic;
      letter-spacing: 2px;
      color: #333;
      margin-top: 5px;
    }

    /* --- PAGE CONTAINERS --- */
    .page {
      display: none; /* Hidden by default, managed by JS */
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0, 0.05);
      width: 450px;
      text-align: left;
    }

    .active-page {
      display: flex;
      flex-direction: column;
    }

    /* --- INPUTS & BUTTONS --- */
    label {
      font-weight: bold;
      color: #666;
      font-size: 0.9em;
      margin-top: 10px;
    }

    input[type="text"], input[type="number"], select {
      width: 90%;
      padding: 10px;
      margin: 5px 0 15px 0;
      border: 1px solid #dcdcdc;
      border-radius: 10px;
      font-family: inherit;
      background-color: #fafafa;
    }

    .btn-group {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    button {
      background-color: #1a1a1a; /* Black to match logo */
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1em;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button.secondary {
      background-color: #E6E6FA;
      color: #333;
      border: 1px solid #ccc;
    }

    button:hover { opacity: 0.8; }

    /* --- TRACKER APP --- */
    #tracker-page {
      width: auto;
      background: transparent;
      box-shadow: none;
      flex-direction: row;
      gap: 20px;
      align-items: flex-start;
    }

    .tracker-container {
      position: relative;
      border: 8px solid #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0, 0.1);
      overflow: hidden;
      background-color: #000;
      width: 640px;
      height: 480px;
    }

    .input_video, .output_canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* Mirror effect */
    }

    .output_canvas {
      position: absolute;
      top: 0; left: 0;
    }

    .feedback-panel {
      width: 320px;
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0, 0.1);
      text-align: left;
    }

    .status-badge {
      display: inline-block;
      background: #E6E6FA;
      color: #333;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 0.9em;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .feedback-text {
      font-size: 1em;
      line-height: 1.4;
      color: #555;
      min-height: 80px;
    }
    
    .arm-feedback {
      margin-top: 10px;
      padding: 10px;
      background: #fafafa;
      border-left: 3px solid #ff4d4d; /* Red detail matching logo */
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="Red and Black Ballet Logo.jpg" alt="Écarté.ai Logo" class="logo">
    <h1>Écarté.ai</h1>
  </div>

  <div id="setup-page" class="page active-page">

    <label>Name</label>
    <input type="text" id="userName" placeholder="Your Name">
    
    <div style="display: flex; gap: 10px;">
      <div style="flex: 1;">
        <label>Age</label>
        <input type="number" id="userAge" placeholder="Age">
      </div>
      <div style="flex: 1;">
        <label>Gender</label>
        <select id="userGender">
          <option value="Female">Female</option>
          <option value="Male">Male</option>
          <option value
