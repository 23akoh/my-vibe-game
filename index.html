<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Ballet AI Tracker</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    body {
      background: linear-gradient(135deg, #ffe4e1, #e6e6fa);
      font-family: 'Helvetica Neue', sans-serif;
      color: #6a5acd;
      text-align: center;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-family: 'Georgia', serif;
      font-style: italic;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    /* Container to hold camera and feedback side-by-side */
    .main-container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
      align-items: flex-start;
    }

    .tracker-container {
      position: relative;
      border: 8px solid #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(106, 90, 205, 0.2);
      overflow: hidden;
      background-color: #fff;
    }

    .input_video, .output_canvas {
      width: 640px;
      height: 480px;
      transform: scaleX(-1);
    }

    .output_canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    /* The Aesthetic Feedback Panel */
    .feedback-panel {
      width: 300px;
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(106, 90, 205, 0.1);
      text-align: left;
    }

    .feedback-panel h2 {
      color: #ff69b4;
      font-size: 1.2em;
      margin-top: 0;
      border-bottom: 2px solid #ffe4e1;
      padding-bottom: 10px;
    }

    .feedback-text {
      font-size: 1.1em;
      font-weight: bold;
      color: #7b68ee;
      min-height: 50px;
    }

    /* Image to show correct posture */
    .reference-image {
      width: 100%;
      border-radius: 10px;
      margin-top: 15px;
      display: none; /* Hidden by default */
    }
  </style>
</head>
<body>

  <h1>Virtual Ballet Coach</h1>
  <div id="loading">Loading camera and AI model...</div>

  <div class="main-container">
    <div class="tracker-container">
      <video class="input_video" autoplay playsinline style="display:none;"></video>
      <canvas class="output_canvas" width="640" height="480"></canvas>
    </div>

    <div class="feedback-panel">
      <h2>AI Corrections</h2>
      <div class="feedback-text" id="feedback">Stand in front of the camera to begin analyzing your port de bras!</div>
      <img id="ref-image" class="reference-image" src="https://images.unsplash.com/photo-1518834107812-67b0b7c58434?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Correct Arm Curve">
    </div>
  </div>

  <script>
    const videoElement = document.getElementsByClassName('input_video')[0];
    const canvasElement = document.getElementsByClassName('output_canvas')[0];
    const canvasCtx = canvasElement.getContext('2d');
    const feedbackText = document.getElementById('feedback');
    const refImage = document.getElementById('ref-image');

    // Math formula to calculate the angle between three points (e.g., shoulder, elbow, wrist)
    function calculateAngle(a, b, c) {
      let radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs(radians * 180.0 / Math.PI);
      if (angle > 180.0) {
        angle = 360 - angle;
      }
      return angle;
    }

    function onResults(results) {
      document.getElementById('loading').style.display = 'none';
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // Draw the video frame on the canvas
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        // STEP 1: Hide the face dots! (Indices 0 through 10)
        for (let i = 0; i <= 10; i++) {
          results.poseLandmarks[i].visibility = 0; 
        }

        // Draw the aesthetic pink and purple skeleton
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#ffb6c1', lineWidth: 4});
        drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#9370db', lineWidth: 2, radius: 4});

        // STEP 2: The Ballet Logic Engine
        // Get the positions for Left Arm (Shoulder: 11, Elbow: 13, Wrist: 15)
        let leftShoulder = results.poseLandmarks[11];
        let leftElbow = results.poseLandmarks[13];
        let leftWrist = results.poseLandmarks[15];

        // Ensure the AI can actually see your arm clearly before judging
        if (leftShoulder.visibility > 0.5 && leftElbow.visibility > 0.5 && leftWrist.visibility > 0.5) {
          
          let elbowAngle = calculateAngle(leftShoulder, leftElbow, leftWrist);

          // If the angle is too close to 180 degrees, the arm is stiff and locked
          if (elbowAngle > 165) {
            feedbackText.innerText = "Your arms are too straight! Soften the elbows and create a curve.";
            refImage.style.display = "block"; // Show the visual reference
          } 
          // If the angle is good, clear the warning
          else if (elbowAngle > 130 && elbowAngle <= 165) {
            feedbackText.innerText = "Beautiful arm curve. Hold that shape!";
            refImage.style.display = "none"; // Hide the image
          }
        }
      }
      canvasCtx.restore();
    }

    const pose = new Pose({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
    }});
    
    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await pose.send({image: videoElement});
      },
      width: 640,
      height: 480
    });
    
    camera.start();
  </script>

</body>
</html>
