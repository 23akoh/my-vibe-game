<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>écarte.ai</title>
  
  <link rel="icon" type="image/jpeg" href="Red and Black Ballet Logo.jpg">
  
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    /* --- LILAC AESTHETIC THEME --- */
    body {
      background-color: #E6E6FA; 
      background-image: radial-gradient(circle at center, #F8F8FF 0%, #E6E6FA 100%);
      font-family: 'Helvetica Neue', sans-serif;
      color: #4a4a4a;
      text-align: center;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0.03;
      background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><path d="M50 10 Q60 40 80 50 Q60 60 50 90 Q40 60 20 50 Q40 40 50 10 Z" fill="none" stroke="black" stroke-width="2"/></svg>');
      pointer-events: none;
      z-index: -1;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 150px;
      border-radius: 10px;
      mix-blend-mode: multiply; 
    }

    /* --- PAGE CONTAINERS --- */
    .page {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0, 0.05);
      width: 450px;
      text-align: left;
    }

    #setup-page { display: flex; flex-direction: column; }
    #profile-page { display: none; }
    #tracker-page { display: none; width: auto; background: transparent; box-shadow: none; align-items: flex-start; gap: 20px; }

    /* --- INPUTS & BUTTONS --- */
    label {
      font-weight: bold;
      color: #666;
      font-size: 0.9em;
      margin-top: 12px;
      display: block;
    }

    input[type="text"], select {
      width: 90%;
      padding: 11px;
      margin: 6px 0 16px 0;
      border: 1px solid #dcdcdc;
      border-radius: 10px;
      font-family: inherit;
      background-color: #fafafa;
    }

    .btn-group {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    button {
      background-color: #1a1a1a; 
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.1em;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button.secondary {
      background-color: #E6E6FA;
      color: #333;
      border: 1px solid #ccc;
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

    /* --- TRACKER APP --- */
    .tracker-container {
      position: relative;
      border: 8px solid #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0, 0.1);
      overflow: hidden;
      background-color: #000;
      width: 640px;
      height: 480px;
    }

    .input_video, .output_canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1); 
    }

    .output_canvas {
      position: absolute;
      top: 0; left: 0;
    }

    .feedback-panel {
      width: 320px;
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0, 0.1);
      text-align: left;
    }

    .status-badge {
      display: inline-block;
      background: #E6E6FA;
      color: #333;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 0.9em;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .feedback-text {
      font-size: 1em;
      line-height: 1.4;
      color: #555;
      min-height: 60px;
    }
    
    .arm-feedback {
      margin-top: 10px;
      padding: 10px;
      background: #fafafa;
      border-left: 3px solid #ff4d4d; 
      font-size: 0.9em;
    }

    .error-text { color: #d9534f; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <img src="Red and Black Ballet Logo.jpg" alt="Écarté.ai Logo" class="logo">
  </div>

  <div id="setup-page" class="page">
    <h2>Welcome to the Studio</h2>
    
    <label>Name</label>
    <input type="text" id="userName" placeholder="Your Name">

    <label>Method / School</label>
    <select id="danceMethod">
      <option value="Vaganova">Vaganova</option>
      <option value="Cecchetti">Cecchetti</option>
      <option value="Royal Academy of Dance (RAD)">Royal Academy of Dance (RAD)</option>
      <option value="Balanchine">Balanchine</option>
      <option value="French School">French School</option>
      <option value="Bournonville">Bournonville</option>
    </select>

    <label>Camera Focus Area</label>
    <select id="cameraFocus">
      <option value="upper" selected>Upper Body (Arms, Back, Head)</option>
      <option value="lower">Lower Body (Legs, Feet)</option>
      <option value="full">Full Body</option>
    </select>

    <label>Your Focus / Goals</label>
    <input type="text" id="userGoals" placeholder="E.g. Extended lines, softer fingers...">
    
    <div class="btn-group" style="justify-content: flex-end;">
      <button onclick="goToProfile()">Next ➔</button>
    </div>
  </div>

  <div id="profile-page" class="page">
    <h2>Dancer Dashboard</h2>
    <p><strong>Name:</strong> <span id="display-name"></span></p>
    <p><strong>Method:</strong> <span id="display-method"></span></p>
    <p><strong>Tracking Focus:</strong> <span id="display-focus"></span></p>
    <p><strong>Goals:</strong> <span id="display-goals"></span></p>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    
    <div class="btn-group">
      <button class="secondary" onclick="goToSetup()">Back</button>
      <button onclick="goToTracker()">Enter Studio</button>
    </div>
  </div>

  <div id="tracker-page" class="page">
    <div class="tracker-container">
      <video class="input_video" autoplay playsinline style="display:none;"></video>
      <canvas class="output_canvas" width="640" height="480"></canvas>
    </div>

    <div class="feedback-panel">
      <h2>Live Feedback</h2>
      <div class="status-badge" id="detectedPosition">Detecting...</div>
      <div class="feedback-text" id="feedback">Loading your mirror...</div>
      <div class="arm-feedback" id="armFeedback">Tracking arms...</div>
      
      <div class="btn-group" style="margin-top: 30px;">
        <button class="secondary" onclick="goToProfile()">End Session</button>
      </div>
    </div>
  </div>

  <script>
    // --- NAVIGATION LOGIC ---
    let currentFocus = "upper";

    function hideAllPages() {
      document.getElementById('setup-page').style.display = 'none';
      document.getElementById('profile-page').style.display = 'none';
      document.getElementById('tracker-page').style.display = 'none';
    }

    function goToSetup() {
      hideAllPages();
      document.getElementById('setup-page').style.display = 'flex';
    }

    function goToProfile() {
      hideAllPages();
      currentFocus = document.getElementById('cameraFocus').value;
      
      document.getElementById('display-name').innerText = document.getElementById('userName').value || "Dancer";
      document.getElementById('display-method').innerText = document.getElementById('danceMethod').value;
      document.getElementById('display-focus').innerText = currentFocus === "upper" ? "Upper Body" : currentFocus === "lower" ? "Lower Body" : "Full Body";
      document.getElementById('display-goals').innerText = document.getElementById('userGoals').value || "None set";
      
      document.getElementById('profile-page').style.display = 'flex';
      document.getElementById('profile-page').style.flexDirection = 'column';
    }

    let cameraStarted = false;
    function goToTracker() {
      hideAllPages();
      document.getElementById('tracker-page').style.display = 'flex';
      
      if (!cameraStarted) {
        camera.start();
        cameraStarted = true;
      }
    }

    // --- AI MATH & POSITION LOGIC ---
    const videoElement = document.getElementsByClassName('input_video')[0];
    const canvasElement = document.getElementsByClassName('output_canvas')[0];
    const canvasCtx = canvasElement.getContext('2d');
    
    const feedbackText = document.getElementById('feedback');
    const armFeedbackText = document.getElementById('armFeedback');
    const detectedPositionBadge = document.getElementById('detectedPosition');

    function calculateAngle(a, b, c) {
      let radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs(radians * 180.0 / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return angle;
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        // Hide distracting facial tracking points
        for (let i = 0; i <= 10; i++) results.poseLandmarks[i].visibility = 0;

        // Render clean structural lines matching your logo palette
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#1a1a1a', lineWidth: 3});
        drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#ff4d4d', lineWidth: 2, radius: 4});

        let leftWrist = results.poseLandmarks[15];
        let rightWrist = results.poseLandmarks[16];
        let leftElbow = results.poseLandmarks[13];
        let rightElbow = results.poseLandmarks[14];
        let leftShoulder = results.poseLandmarks[11];
        let rightShoulder = results.poseLandmarks[12];
        let leftAnkle = results.poseLandmarks[27];
        let rightAnkle = results.poseLandmarks[28];

        // 1. DYNAMIC VISIBILITY FILTER
        let visibilityIssue = false;
        if (currentFocus === "upper" && (leftWrist.visibility < 0.5 || rightWrist.visibility < 0.5)) visibilityIssue = true;
        if (currentFocus === "lower" && (leftAnkle.visibility < 0.5 || rightAnkle.visibility < 0.5)) visibilityIssue = true;
        if (currentFocus === "full" && (leftWrist.visibility < 0.5 || leftAnkle.visibility < 0.5)) visibilityIssue = true;

        if (visibilityIssue) {
          feedbackText.innerHTML = `<span class='error-text'>⚠️ Target frame blocked! Readjust so your ${currentFocus} body is visible in the mirror feed.</span>`;
          armFeedbackText.innerText = "";
          canvasCtx.restore();
          return;
        }

        // 2. STAGE-GRADE ARM CURVATURE ANALYSIS
        let leftAngle = calculateAngle(leftShoulder, leftElbow, leftWrist);
        let rightAngle = calculateAngle(rightShoulder, rightElbow, rightWrist);
        let armStatus = [];

        // Tightened thresholds to capture broken/drooping shapes or locked elbows
        if (leftAngle > 162) armStatus.push("Left arm is too straight (soften the elbow).");
        else if (leftAngle < 125) armStatus.push("Left arm is too sharply bent.");
        
        if (rightAngle > 162) armStatus.push("Right arm is too straight (soften the elbow).");
        else if (rightAngle < 125) armStatus.push("Right arm is too sharply bent.");

        if (armStatus.length === 0) {
          armFeedbackText.innerText = "✨ Beautiful, seamless elongation. Soften your hands and extend naturally through your index fingers.";
        } else {
          armFeedbackText.innerText = armStatus.join(" ") + " Keep fingers soft and expressive, avoiding dropped thumbs.";
        }

        // 3. ALL-POSITION POSITION ANALYZER
        let wristDistance = Math.abs(leftWrist.x - rightWrist.x);
        let avgShoulderY = (leftShoulder.y + rightShoulder.y) / 2;
        
        let leftHigh = leftWrist.y < avgShoulderY - 0.12;
        let rightHigh = rightWrist.y < avgShoulderY - 0.12;
        let leftMid = leftWrist.y >= avgShoulderY - 0.12 && leftWrist.y <= avgShoulderY + 0.15;
        let rightMid = rightWrist.y >= avgShoulderY - 0.12 && rightWrist.y <= avgShoulderY + 0.15;
        let leftLow = leftWrist.y > avgShoulderY + 0.15;
        let rightLow = rightWrist.y > avgShoulderY + 0.15;

        // Symmetric Positions
        if (leftHigh && rightHigh) {
          if (wristDistance < 0.28) {
            detectedPositionBadge.innerText = "5th Position (En Haut)";
            feedbackText.innerText = "Frame your face without lifting the shoulders. Drop your shoulder blades down your back.";
          } else {
            detectedPositionBadge.innerText = "Open 5th / High V";
            feedbackText.innerText = "Keep the extension conversational. Breathe out through the palms.";
          }
        } 
        else if (leftMid && rightMid) {
          if (wristDistance > 0.48) {
            detectedPositionBadge.innerText = "2nd Position";
            feedbackText.innerText = "Keep elbows supported from underneath. Slope the line down gently from the shoulder to the wrist.";
          } else if (wristDistance < 0.25) {
            detectedPositionBadge.innerText = "1st Position (En Avant)";
            feedbackText.innerText = "Maintain a rounded shape in front of your sternum. Imagine holding a fragile vase.";
          } else {
            detectedPositionBadge.innerText = "Demi-Seconde";
            feedbackText.innerText = "Halfway between 1st and 2nd. Keep the line relaxed and sloping down.";
          }
        } 
        else if (leftLow && rightLow && wristDistance < 0.25) {
          detectedPositionBadge.innerText = "Bras Bas (En Bas)";
          feedbackText.innerText = "Preparatory stance. Create a clean oval shape, keeping your hands well forward of your thighs.";
        }
        // Asymmetric Positions (3rd / 4th Variations)
        else if ((leftHigh && rightMid) || (rightHigh && leftMid)) {
          detectedPositionBadge.innerText = "3rd Position";
          feedbackText.innerText = "Coordinate the lines cleanly. The high arm frames the head while the side arm supports from behind.";
        }
        else if ((leftHigh && rightLow) || (rightHigh && leftLow)) {
          detectedPositionBadge.innerText = "4th Position (En Haut)";
          feedbackText.innerText = "Ensure your forward arm remains rounded and doesn't pull behind your center line.";
        }
        else if ((leftMid && rightLow) || (rightMid && leftLow)) {
          detectedPositionBadge.innerText = "4th Position (En Avant)";
          feedbackText.innerText = "Check your spacing. One arm remains steady in 1st while the other completes the low frame.";
        }
        else {
          detectedPositionBadge.innerText = "Transitioning...";
          feedbackText.innerText = "Holding a transition line. Ground your stance and extend your crown.";
        }
      }
      canvasCtx.restore();
    }

    const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => { await pose.send({image: videoElement}); },
      width: 640, height: 480
    });
  </script>

</body>
</html>
