<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Écarté.ai | Full Studio</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50,45 C35,20 15,30 25,50 C35,65 45,52 50,45 Z' fill='%231a1a1a'/><path d='M50,45 C65,20 85,30 75,50 C65,65 55,52 50,45 Z' fill='%231a1a1a'/><circle cx='50' cy='45' r='7' fill='%231a1a1a'/><path d='M46,48 C35,60 20,80 25,85 C28,87 40,70 48,52' fill='%231a1a1a'/><path d='M54,48 C65,60 80,80 75,85 C72,87 60,70 52,52' fill='%231a1a1a'/></svg>">
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    body {
      background-color: #E6E6FA; 
      background-image: radial-gradient(circle at center, #F8F8FF 0%, #E6E6FA 100%);
      font-family: 'Helvetica Neue', sans-serif;
      color: #4a4a4a;
      text-align: center;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header { margin-bottom: 25px; }
    .logo { width: 160px; border-radius: 12px; mix-blend-mode: multiply; }

    .page {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0, 0.05);
      width: 450px;
      text-align: left;
    }

    #setup-page { display: flex; flex-direction: column; }
    #profile-page, #tracker-page, #summary-page { display: none; }
    #tracker-page { width: auto; background: transparent; box-shadow: none; align-items: flex-start; gap: 20px; }

    label { font-weight: bold; color: #666; font-size: 0.9em; margin-top: 12px; display: block; }
    input[type="text"], select { width: 90%; padding: 11px; margin: 6px 0 16px 0; border: 1px solid #dcdcdc; border-radius: 10px; background-color: #fafafa; }

    .btn-group { display: flex; justify-content: space-between; margin-top: 20px; }
    button { background-color: #1a1a1a; color: white; border: none; padding: 14px 28px; font-size: 1.1em; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    button.secondary { background-color: #E6E6FA; color: #333; border: 1px solid #ccc; }
    button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

    .tracker-container { position: relative; border: 8px solid #ffffff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0, 0.1); overflow: hidden; background-color: #000; width: 640px; height: 480px; }
    .input_video, .output_canvas { width: 100%; height: 100%; transform: scaleX(-1); }
    .output_canvas { position: absolute; top: 0; left: 0; }

    .feedback-panel { width: 340px; background: #ffffff; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0, 0.1); text-align: left; }
    .status-badge { display: inline-block; background: #E6E6FA; color: #333; padding: 5px 10px; border-radius: 15px; font-size: 0.9em; font-weight: bold; margin-bottom: 10px; }
    .feedback-text { font-size: 1em; line-height: 1.4; color: #555; min-height: 60px; font-weight: bold; }
    
    .arm-feedback { margin-top: 10px; padding: 10px; background: #fafafa; border-left: 3px solid #ff4d4d; font-size: 0.9em; line-height: 1.4; }
    
    .summary-block { margin-bottom: 15px; padding: 12px; background: #fafafa; border-radius: 10px; border-left: 4px solid #1a1a1a; }
    .summary-block h3 { margin: 0 0 5px 0; font-size: 1.05em; color: #222; }
    .summary-block ul { margin: 0; padding-left: 20px; color: #555; font-size: 0.95em; }
  </style>
</head>
<body>

  <div class="header">
    <img src="Red and Black Ballet Logo.jpg" alt="Écarté.ai Logo" class="logo">
  </div>

  <div id="setup-page" class="page">
    <h2>Welcome to the Studio</h2>
    <label>Name</label><input type="text" id="userName" placeholder="Your Name">
    <label>Method / School</label>
    <select id="danceMethod">
      <option value="Vaganova">Vaganova</option>
      <option value="Balanchine">Balanchine</option>
      <option value="RAD">RAD</option>
    </select>
    <div class="btn-group" style="justify-content: flex-end;">
      <button type="button" onclick="goToProfile()">Next ➔</button>
    </div>
  </div>

  <div id="profile-page" class="page">
    <h2>Dancer Dashboard</h2>
    <p><strong>Name:</strong> <span id="display-name"></span></p>
    <p><strong>Method:</strong> <span id="display-method"></span></p>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    <div class="btn-group">
      <button type="button" class="secondary" onclick="goToSetup()">Back</button>
      <button type="button" onclick="goToTracker()">Next ➔ Enter Studio</button>
    </div>
  </div>

  <div id="tracker-page" class="page">
    <div class="tracker-container">
      <video class="input_video" autoplay playsinline style="display:none;"></video>
      <canvas class="output_canvas" width="640" height="480"></canvas>
    </div>
    <div class="feedback-panel">
      <h2>Live Feedback</h2>
      <div class="status-badge" id="detectedPosition">Detecting...</div>
      <div class="feedback-text" id="feedback">Initializing mirror...</div>
      <div class="arm-feedback" id="armFeedback">Tracking full body...</div>
      <div class="btn-group" style="margin-top: 30px;">
        <button type="button" class="secondary" onclick="goToEndSession()">End Session ➔</button>
      </div>
    </div>
  </div>

  <div id="summary-page" class="page">
    <h2>Session Summary</h2>
    <div id="summaryContainer" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;"></div>
    <div class="btn-group" style="justify-content: flex-end;">
      <button type="button" onclick="goToProfile()">New Session ➔</button>
    </div>
  </div>

  <script>
    let positionHistory = {}; 

    function hideAllPages() { document.querySelectorAll('.page').forEach(p => p.style.display = 'none'); }
    function goToSetup() { hideAllPages(); document.getElementById('setup-page').style.display = 'flex'; }
    function goToProfile() {
      hideAllPages();
      document.getElementById('display-name').innerText = document.getElementById('userName').value || "Dancer";
      document.getElementById('display-method').innerText = document.getElementById('danceMethod').value;
      document.getElementById('profile-page').style.display = 'flex';
      document.getElementById('profile-page').style.flexDirection = 'column';
    }

    let cameraStarted = false;
    function goToTracker() {
      hideAllPages();
      document.getElementById('tracker-page').style.display = 'flex';
      positionHistory = {}; 
      setTimeout(async () => {
        if (!cameraStarted && typeof camera !== 'undefined') {
          try { await camera.start(); cameraStarted = true; document.getElementById('feedback').innerText = "Mirror connected. Show me your lines."; } 
          catch(e) { document.getElementById('feedback').innerText = "Camera error."; }
        }
      }, 10);
    }

    function goToEndSession() {
      hideAllPages();
      const container = document.getElementById('summaryContainer');
      container.innerHTML = "";
      const trackedPositions = Object.keys(positionHistory);
      if (trackedPositions.length === 0) container.innerHTML = "<div class='summary-block'><h3>No Positions Tracked</h3></div>";
      else {
        trackedPositions.forEach(pos => {
          let blockHTML = `<div class='summary-block'><h3>${pos}</h3><ul>`;
          let errors = Array.from(positionHistory[pos]); 
          if (errors.length === 0) blockHTML += `<li>✨ Perfect alignment kept throughout!</li>`;
          else errors.forEach(err => blockHTML += `<li>${err}</li>`);
          blockHTML += `</ul></div>`;
          container.innerHTML += blockHTML;
        });
      }
      document.getElementById('summary-page').style.display = 'flex';
    }

    const videoElement = document.getElementsByClassName('input_video')[0];
    const canvasElement = document.getElementsByClassName('output_canvas')[0];
    const canvasCtx = canvasElement.getContext('2d');
    const feedbackText = document.getElementById('feedback');
    const armFeedbackText = document.getElementById('armFeedback');
    const detectedPositionBadge = document.getElementById('detectedPosition');

    function calculateAngle(a, b, c) {
      let radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs(radians * 180.0 / Math.PI);
      return angle > 180.0 ? 360 - angle : angle;
    }

    function onResults(results) {
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.translate(canvasElement.width, 0);
      canvasCtx.scale(-1, 1);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        for (let i = 0; i <= 10; i++) results.poseLandmarks[i].visibility = 0; // Hide face lines
        
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#1a1a1a', lineWidth: 3});
        drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#ff4d4d', lineWidth: 2, radius: 4});

        let nose = results.poseLandmarks[0];
        let leftEar = results.poseLandmarks[7];
        let rightEar = results.poseLandmarks[8];

        let leftShoulder = results.poseLandmarks[11], rightShoulder = results.poseLandmarks[12];
        let leftWrist = results.poseLandmarks[15], rightWrist = results.poseLandmarks[16];
        let leftHip = results.poseLandmarks[23], rightHip = results.poseLandmarks[24];
        let leftKnee = results.poseLandmarks[25], rightKnee = results.poseLandmarks[26];
        let leftAnkle = results.poseLandmarks[27], rightAnkle = results.poseLandmarks[28];
        let leftFoot = results.poseLandmarks[31], rightFoot = results.poseLandmarks[32]; // Foot indexes for toe tracking

        let torsoHeight = Math.max(0.1, Math.abs(((leftHip.y + rightHip.y)/2) - ((leftShoulder.y + rightShoulder.y)/2))); 
        let hipWidth = Math.abs(leftHip.x - rightHip.x);
        let currentFrameErrors = [];
        let currentPosName = "Transitioning...";

        // ---- 1. ARABESQUE & EXTENSION DETECTION ----
        // Detect if one foot is significantly lifted back (using y-height and x-spread)
        let leftLegLifted = leftAnkle.y < rightAnkle.y - (0.15 * torsoHeight) && Math.abs(leftAnkle.x - rightAnkle.x) > 0.15;
        let rightLegLifted = rightAnkle.y < leftAnkle.y - (0.15 * torsoHeight) && Math.abs(rightAnkle.x - leftAnkle.x) > 0.15;

        if (leftLegLifted || rightLegLifted) {
          currentPosName = "Arabesque Line";
          
          // Shoulders Down Check
          if (Math.abs(leftShoulder.y - leftEar.y) < 0.08 || Math.abs(rightShoulder.y - rightEar.y) < 0.08) {
            currentFrameErrors.push("Shoulders are creeping up. Press them down and lengthen your neck.");
          }
          
          // Eyeline Check
          if (nose.y > leftShoulder.y - 0.05) {
            currentFrameErrors.push("Eyeline is dropping. Lift your chin and project outward.");
          }

          // Pitching/Leaning Forward Check
          let avgShoulderX = (leftShoulder.x + rightShoulder.x) / 2;
          let avgHipX = (leftHip.x + rightHip.x) / 2;
          if (Math.abs(avgShoulderX - avgHipX) > 0.12 * torsoHeight) {
            currentFrameErrors.push("You are leaning too far forward. Lift your chest and pull your weight back over the supporting leg.");
          }

          // Working Leg Turnout Check
          let liftedKnee = leftLegLifted ? leftKnee : rightKnee;
          let liftedAnkle = leftLegLifted ? leftAnkle : rightAnkle;
          if (liftedKnee.y > liftedAnkle.y) {
            currentFrameErrors.push("Ensure turnout on the lifted leg—don't let the knee face the floor.");
          }

          // Arm Level Checks
          let avgShoulderY = (leftShoulder.y + rightShoulder.y) / 2;
          if (leftWrist.y > avgShoulderY + 0.1 && rightWrist.y > avgShoulderY + 0.1) {
            currentFrameErrors.push("Arms are too low for Arabesque. Lift the forward arm to eye level.");
          } else if (leftWrist.y < avgShoulderY - 0.25 || rightWrist.y < avgShoulderY - 0.25) {
            currentFrameErrors.push("Arms are reaching too high. Keep the lines elongated from the shoulder.");
          }
        } 
        
        // ---- 2. GROUNDED STANCE & TURNOUT CHECKS ----
        else if (leftAnkle.visibility > 0.5 && rightAnkle.visibility > 0.5) {
          let distanceBetweenAnkles = Math.abs(leftAnkle.x - rightAnkle.x);
          let areHeelsTouching = distanceBetweenAnkles < hipWidth * 0.6;
          
          if (areHeelsTouching) currentPosName = "1st/5th Position";
          else if (distanceBetweenAnkles > hipWidth * 1.5) currentPosName = "2nd/4th Position";

          // "Forcing Turnout" / Rolling on Arches Check
          // If feet are wider than knees, the knees are collapsing inward
          let kneeDistance = Math.abs(leftKnee.x - rightKnee.x);
          if (distanceBetweenAnkles > kneeDistance + 0.05) {
            currentFrameErrors.push("Don't force turnout from your feet! Your knees are dropping inward. Rotate from the hips and stop rolling on your arches.");
          }

          // "Leaning on Toes" / "Crunching Toes" Check
          // If the ankle is pushed too far vertically in front of the toe line while grounded
          let leftToePitch = leftAnkle.x - leftFoot.x;
          let rightToePitch = rightAnkle.x - rightFoot.x;
          if (Math.abs(leftToePitch) > 0.08 || Math.abs(rightToePitch) > 0.08) {
            currentFrameErrors.push("Don't lean on your toes or crunch them into the floor. Spread your weight evenly through the metatarsals.");
          }
        }

        // --- UI UPDATES ---
        if (currentPosName === "Arabesque Line") {
          feedbackText.innerText = "Holding Arabesque. Focus on elongation and suspension through the spine.";
        } else if (currentPosName === "1st/5th Position") {
          feedbackText.innerText = "Grounded close position. Pull up through the inner thighs.";
        } else if (currentPosName === "2nd/4th Position") {
          feedbackText.innerText = "Grounded open position. Keep your pelvis perfectly centered.";
        } else {
          feedbackText.innerText = "Tracking full body geometry...";
        }

        detectedPositionBadge.innerText = currentPosName;

        if (currentPosName !== "Transitioning...") {
          if (!positionHistory[currentPosName]) positionHistory[currentPosName] = new Set();
          currentFrameErrors.forEach(err => positionHistory[currentPosName].add(err));
        }

        if (currentFrameErrors.length === 0) {
          armFeedbackText.innerText = "✨ Alignment is secure. Beautiful line.";
        } else {
          armFeedbackText.innerHTML = currentFrameErrors.map(e => `• ${e}`).join("<br>");
        }
      }
      canvasCtx.restore();
    }

    const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
    pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
    pose.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => { await pose.send({image: videoElement}); },
      width: 640, height: 480
    });
  </script>

</body>
</html>
