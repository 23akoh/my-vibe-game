<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Écarté.ai | Studio</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50,45 C35,20 15,30 25,50 C35,65 45,52 50,45 Z' fill='%231a1a1a'/><path d='M50,45 C65,20 85,30 75,50 C65,65 55,52 50,45 Z' fill='%231a1a1a'/><circle cx='50' cy='45' r='7' fill='%231a1a1a'/><path d='M46,48 C35,60 20,80 25,85 C28,87 40,70 48,52' fill='%231a1a1a'/><path d='M54,48 C65,60 80,80 75,85 C72,87 60,70 52,52' fill='%231a1a1a'/></svg>">
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    /* --- LILAC AESTHETIC THEME --- */
    body {
      background-color: #E6E6FA; 
      background-image: radial-gradient(circle at center, #F8F8FF 0%, #E6E6FA 100%);
      font-family: 'Helvetica Neue', sans-serif;
      color: #4a4a4a;
      text-align: center;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header { margin-bottom: 25px; }
    .logo { width: 160px; border-radius: 12px; mix-blend-mode: multiply; }

    /* --- BASE PAGE CONTAINERS --- */
    .page {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0, 0.05);
      width: 500px;
      text-align: left;
    }

    #setup-page { display: flex; flex-direction: column; }
    #profile-page, #tracker-page, #summary-page { display: none; }
    
    #tracker-page { width: auto; max-width: 1200px; background: transparent; box-shadow: none; align-items: flex-start; gap: 30px; flex-direction: row; }
    #summary-page { width: 640px; flex-direction: column; }

    /* --- FORM STYLING --- */
    label { font-weight: bold; color: #666; font-size: 0.9em; margin-top: 14px; display: block; }
    input[type="text"], input[type="number"], select, input[type="file"] { 
      width: 95%; 
      padding: 11px; 
      margin: 6px 0 10px 0; 
      border: 1px solid #dcdcdc; 
      border-radius: 10px; 
      background-color: #fafafa; 
      font-family: inherit; 
      font-size: 0.95em; 
      box-sizing: border-box;
    }

    .sync-row { display: flex; gap: 15px; }
    .sync-col { flex: 1; }

    .btn-group { display: flex; justify-content: space-between; margin-top: 25px; width: 100%; }
    button { background-color: #1a1a1a; color: white; border: none; padding: 14px 28px; font-size: 1.1em; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    button.secondary { background-color: #E6E6FA; color: #333; border: 1px solid #ccc; }
    button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

    /* --- COMPARISON STUDIO LAYOUT (STACKED & LANDSCAPE) --- */
    .video-stack-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .video-box {
      position: relative;
      border: 6px solid #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0, 0.1);
      overflow: hidden;
      background-color: #000;
      /* Landscape 16:9 Aspect Ratio */
      width: 640px;
      height: 360px; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .video-box-title {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.85em;
      font-weight: bold;
      z-index: 10;
    }

    /* object-fit: contain prevents squishing while showing full video */
    .video_element, .output_canvas {
      width: 100%;
      height: 100%;
      object-fit: contain; 
      position: absolute;
      top: 0; 
      left: 0;
    }

    .playback-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
      background: white;
      padding: 15px;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    .feedback-panel { width: 340px; background: #ffffff; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0, 0.1); text-align: left; }
    .status-badge { display: inline-block; background: #E6E6FA; color: #333; padding: 5px 10px; border-radius: 15px; font-size: 0.9em; font-weight: bold; margin-bottom: 10px; }
    .feedback-text { font-size: 1em; line-height: 1.4; color: #555; min-height: 50px; font-weight: bold; }
    .arm-feedback { margin-top: 10px; padding: 12px; background: #fafafa; border-left: 3px solid #ff4d4d; font-size: 0.9em; line-height: 1.4; border-radius: 0 8px 8px 0; }
    
    /* --- SUMMARY STYLING --- */
    #summaryContainer { max-height: 380px; overflow-y: auto; margin-bottom: 25px; padding-right: 10px; }
    .summary-block { margin-bottom: 18px; padding: 16px; background: #fafafa; border-radius: 12px; border-left: 5px solid #1a1a1a; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .summary-block h3 { margin: 0 0 10px 0; font-size: 1.15em; color: #1a1a1a; letter-spacing: -0.3px; }
    .summary-block ul { margin: 0; padding-left: 20px; color: #555; font-size: 0.98em; }
    .summary-block li { margin-bottom: 8px; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="header">
    <img src="Red and Black Ballet Logo.jpg" alt="Écarté.ai Logo" class="logo" onerror="this.style.display='none'">
  </div>

  <div id="setup-page" class="page">
    <h2>Welcome to the Studio</h2>
    
    <label>Ballet Method</label>
    <select id="danceMethod">
      <option value="The French School">The French School</option>
      <option value="The Vaganova Method">The Vaganova Method</option>
      <option value="The Cecchetti Method">The Cecchetti Method</option>
      <option value="The Bournonville Method">The Bournonville Method</option>
      <option value="The Royal Academy of Dance (RAD) Method">The Royal Academy of Dance (RAD) Method</option>
      <option value="The Balanchine Method">The Balanchine Method</option>
    </select>

    <label>Reference Video (Master Routine)</label>
    <input type="file" id="refVideoInput" accept="video/*">

    <label>Your Video (Performance to Compare)</label>
    <input type="file" id="userVideoInput" accept="video/*">

    <div class="sync-row">
      <div class="sync-col">
        <label>Ref Start Time (sec)</label>
